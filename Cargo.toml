[package]
name = "crump"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal-first guided production instrument for electronic music"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NathanaelRea/crump"
keywords = ["audio", "music", "synthesizer", "terminal", "pipewire"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "crump"

[features]
default = ["pipewire", "gui"]
pipewire = ["dep:pipewire"]
# The egui desktop client over the workspace session. On by default; a bare interactive `crump`
# opens it when a display is available. Without it every CLI command except the interactive
# workspace still works.
gui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
directories = "6.0.0"
eframe = { version = "0.33.3", default-features = false, optional = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", default-features = false, optional = true }
fs2 = "0.4.3"
hound = "3.5.1"
pipewire = { version = "0.10.1", features = ["v1_0_0"], optional = true }
rustix = { version = "1.1.4", features = ["fs"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "2.7.0"
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["formatting", "macros", "serde"] }

[dev-dependencies]
allocation-counter = "0.8.1"
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
