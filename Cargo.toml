[package]
name = "crump"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal-first guided production instrument for electronic music"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/nathan/crump"
keywords = ["audio", "music", "synthesizer", "terminal", "pipewire"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "crump"

[features]
default = ["pipewire"]
pipewire = ["dep:pipewire"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
directories = "6.0.0"
fs2 = "0.4.3"
hound = "3.5.1"
pipewire = { version = "0.10.1", features = ["v1_0_0"], optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "macros"] }
rustix = { version = "1.1.4", features = ["fs"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "2.7.0"
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["formatting", "macros", "serde"] }
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
