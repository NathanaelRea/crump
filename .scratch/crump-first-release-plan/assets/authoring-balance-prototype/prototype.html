<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crump authoring balance prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101310;
      --panel: #171b17;
      --panel-2: #202620;
      --line: #343c34;
      --muted: #8b998b;
      --text: #e4eadf;
      --lime: #b7e35b;
      --amber: #ffbd62;
      --cyan: #65cddd;
      --red: #ff766b;
      --mono: "IBM Plex Mono", "Cascadia Mono", "DejaVu Sans Mono", monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 var(--mono); }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    .shell { min-height: 100vh; padding-bottom: 74px; }
    .topbar { height: 48px; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #0b0e0b; }
    .brand { color: var(--lime); font-weight: 800; letter-spacing: .14em; }
    .transport { display: flex; gap: 12px; align-items: center; }
    .playing { color: var(--lime); }
    .revision { margin-left: auto; color: var(--muted); }
    .revision strong { color: var(--cyan); }
    .panel { background: var(--panel); border: 1px solid var(--line); min-width: 0; overflow: hidden; }
    .panel-title { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
    .panel-title strong { color: var(--text); font-weight: 600; }
    .source { margin: 0; padding: 14px; white-space: pre; overflow: auto; color: #cdd6c8; }
    .ln { color: #596359; user-select: none; }
    .sel-line { display: inline-block; width: 100%; background: #2b3822; color: #f2f7ed; }
    .token { color: var(--amber); }
    .id { color: var(--cyan); }
    .muted { color: var(--muted); }
    .accent { color: var(--lime); }
    .danger { color: var(--red); }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
    .statusline { padding: 8px 10px; border-top: 1px solid var(--line); color: var(--muted); background: #111511; }
    .selection { color: var(--lime); }
    .rows { padding: 8px; }
    .row { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; padding: 7px 6px; border-bottom: 1px solid #282e28; }
    .row:last-child { border-bottom: 0; }
    .meter { height: 6px; background: #2b312b; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--lime); }
    .value { color: var(--amber); }
    .timeline { padding: 8px; overflow: auto; }
    .ruler { display: grid; grid-template-columns: 80px repeat(8, minmax(46px, 1fr)); color: var(--muted); font-size: 11px; }
    .track { display: grid; grid-template-columns: 80px 1fr; height: 35px; border-top: 1px solid #2b312b; }
    .track-name { padding: 8px 6px; color: var(--muted); }
    .lane { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; padding: 5px 0; position: relative; }
    .clip { border: 1px solid #687d46; background: #344324; color: #dff5b3; padding: 2px 5px; overflow: hidden; white-space: nowrap; cursor: pointer; }
    .clip.alt { border-color: #457480; background: #203c42; color: #bceaf0; }
    .clip.selected { border-color: var(--lime); box-shadow: inset 0 0 0 1px var(--lime); }
    .field { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 10px; border-bottom: 1px solid #282e28; }
    .field span:first-child { color: var(--muted); }
    .action { border: 1px solid #596c3a; background: #26321d; padding: 6px 9px; cursor: pointer; }
    .action:hover { border-color: var(--lime); }
    .source-impact { margin: 10px; padding: 10px; border-left: 3px solid var(--amber); background: #211e17; color: #d9d0bf; }
    .source-impact strong { display: block; color: var(--amber); margin-bottom: 5px; }
    .tabs { display: flex; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); }
    .tab { background: transparent; border: 0; padding: 7px 11px; color: var(--muted); cursor: pointer; }
    .tab.active { color: var(--text); background: var(--panel-2); box-shadow: inset 0 -2px var(--lime); }
    .commands { display: flex; gap: 7px; padding: 9px; flex-wrap: wrap; }
    .command { border: 1px solid var(--line); background: #151915; padding: 5px 8px; color: var(--muted); cursor: pointer; }
    .command:hover { color: var(--text); border-color: var(--muted); }
    .switcher { position: fixed; z-index: 20; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; padding: 6px; border: 1px solid #65725f; border-radius: 999px; background: #e7eee1; color: #111511; box-shadow: 0 8px 34px #000b; }
    .switcher button { border: 0; border-radius: 999px; background: transparent; padding: 7px 11px; cursor: pointer; }
    .switcher button:hover { background: #cdd9c6; }
    .switcher .current { background: #182016; color: #f2f7ed; min-width: 220px; text-align: center; }

    /* A: the text remains the spatial spine. */
    .layout-a { display: grid; grid-template-columns: minmax(420px, 1.6fr) minmax(270px, .8fr); grid-template-rows: calc(100vh - 276px) 220px; gap: 6px; padding: 6px; }
    .layout-a .source-panel { grid-row: 1; }
    .layout-a .side { grid-row: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; min-height: 0; }
    .layout-a .timeline-panel { grid-column: 1 / -1; }

    /* B: a full task canvas with provenance beside it. */
    .layout-b { display: grid; grid-template-columns: minmax(560px, 1fr) 320px; height: calc(100vh - 48px); }
    .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; border-right: 1px solid var(--line); }
    .canvas { padding: 10px; overflow: auto; }
    .canvas-grid { display: grid; grid-template-columns: 1fr 270px; gap: 8px; min-height: 100%; }
    .provenance { background: #121612; overflow: auto; }
    .provenance .source { font-size: 12px; }
    .workspace-view { display: none; }
    .workspace-view.active { display: block; }
    .mixer-bank { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 6px; height: 100%; }
    .strip { display: flex; flex-direction: column; gap: 9px; padding: 10px; border: 1px solid var(--line); background: var(--panel); }
    .fader { width: 8px; height: 105px; margin: auto; background: #333b33; position: relative; }
    .fader i { position: absolute; left: -7px; right: -7px; bottom: 60%; height: 5px; background: var(--lime); }
    .automation-lane { position: relative; height: 90px; margin: 10px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); background: linear-gradient(#1a1f1a 1px, transparent 1px) 0 0 / 100% 22px; }
    .automation-lane svg { width: 100%; height: 100%; }

    /* C: object navigation owns the layout; code is a focused lens. */
    .layout-c { display: grid; grid-template-columns: 240px minmax(440px, 1fr) 300px; height: calc(100vh - 48px); }
    .object-tree { border-right: 1px solid var(--line); padding: 10px 0; background: #111511; }
    .tree-label { padding: 7px 14px; color: var(--muted); }
    .tree-item { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 14px 7px 24px; cursor: pointer; }
    .tree-item.active { background: #28351f; color: var(--lime); box-shadow: inset 3px 0 var(--lime); }
    .lens-main { min-width: 0; display: grid; grid-template-rows: auto 1fr 180px; gap: 6px; padding: 6px; }
    .lens-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; }
    .object-inspector { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; }
    .definition { font-size: 12px; }
    .commandline { margin: 12px; border: 1px solid var(--lime); background: #0c100c; padding: 9px; color: var(--lime); }

    @media (max-width: 850px) {
      .layout-a, .layout-b, .layout-c { display: block; height: auto; }
      .layout-a > *, .layout-b > *, .layout-c > * { margin: 6px; min-height: 220px; }
      .layout-a .source-panel { height: 46vh; }
      .layout-a .side { display: block; }
      .layout-a .side > * { margin-bottom: 6px; }
      .provenance, .object-tree, .object-inspector { border: 1px solid var(--line); }
      .mixer-bank { grid-template-columns: repeat(2, 1fr); }
      .switcher .current { min-width: 150px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="switcher" aria-label="Prototype variant switcher">
    <button id="previous" aria-label="Previous variant">&larr;</button>
    <button class="current" id="variant-label">A - Source spine</button>
    <button id="next" aria-label="Next variant">&rarr;</button>
  </div>

  <template id="topbar">
    <header class="topbar">
      <span class="brand">CRUMP</span>
      <span class="transport"><span class="playing">&#9654; PLAYING</span> 42.1.1 <span class="muted">126 BPM</span></span>
      <span class="pill">Reference Project</span>
      <span class="revision">ACTIVE <strong>r184</strong> &middot; CANDIDATE <strong>r184</strong></span>
    </header>
  </template>

  <script>
    const variants = {
      A: { name: 'Source spine', render: renderA },
      B: { name: 'Task workspaces', render: renderB },
      C: { name: 'Object lens', render: renderC },
    };
    const state = { selected: 'Bass / Hook B', tab: 'Arrange', staged: false };

    function topbar() { return document.querySelector('#topbar').innerHTML; }
    function sourceCode(compact = false) {
      const lines = compact ? [
        '<span class="ln">18</span> <span class="token">track</span> <span class="id">bass</span> {',
        '<span class="ln">19</span>   instrument = sub_bass',
        '<span class="ln">20</span>   clip <span class="id">hook_b</span> at 41.bar {',
        '<span class="sel-line"><span class="ln">21</span>     pattern = bass_hook * 2</span>',
        '<span class="ln">22</span>     duration = 8.bar',
        '<span class="ln">23</span>   }',
        '<span class="ln">24</span> }',
      ] : [
        '<span class="ln">01</span> <span class="muted">// reference-project/song.crump</span>',
        '<span class="ln">02</span> <span class="token">song</span> <span class="id">reference</span> {',
        '<span class="ln">03</span>   end = 96.bar',
        '<span class="ln">04</span>   tempo = [0.bar: 126, 65.bar: 132 linear]',
        '<span class="ln">05</span>',
        '<span class="ln">06</span>   <span class="token">group</span> <span class="id">music</span> {',
        '<span class="ln">07</span>     send room -> room_bus at -14.db post_fader',
        '<span class="ln">08</span>',
        '<span class="ln">09</span>     <span class="token">track</span> <span class="id">drums</span> {',
        '<span class="ln">10</span>       instrument = kit("assets/field-kit")',
        '<span class="ln">11</span>       clip intro at 1.bar  = groove * 4',
        '<span class="ln">12</span>       clip drive at 17.bar = groove.drive(0.18) * 6',
        '<span class="ln">13</span>     }',
        '<span class="ln">14</span>',
        '<span class="ln">15</span>     <span class="token">track</span> <span class="id">bass</span> {',
        '<span class="ln">16</span>       instrument = sub_bass',
        '<span class="ln">17</span>       clip hook_a at 17.bar = bass_hook * 3',
        '<span class="sel-line"><span class="ln">18</span>       clip hook_b at 41.bar = bass_hook * 2</span>',
        '<span class="ln">19</span>       gain = automate(-8.db, bass_gain_curve)',
        '<span class="ln">20</span>     }',
        '<span class="ln">21</span>   }',
        '<span class="ln">22</span> }',
      ];
      return lines.join('\n');
    }

    function timeline() {
      return `<div class="timeline">
        <div class="ruler"><span></span>${[1,17,33,41,49,65,81,96].map(x => `<span>${x}</span>`).join('')}</div>
        ${track('DRUMS', 'Intro', 1, 4, 'Drive', 5, 6)}
        ${track('BASS', 'Hook A', 5, 3, 'Hook B', 9, 4, true)}
        ${track('CHORDS', 'Air', 1, 8, 'Lift', 9, 4)}
        ${track('TEXTURE', 'Field', 1, 12, '', 1, 1)}
      </div>`;
    }

    function track(name, a, aStart, aSpan, b, bStart, bSpan, selected = false) {
      return `<div class="track"><span class="track-name">${name}</span><div class="lane">
        <button class="clip ${name === 'CHORDS' ? 'alt' : ''}" style="grid-column:${aStart}/span ${aSpan}" data-select="${name} / ${a}">${a}</button>
        ${b ? `<button class="clip ${selected ? 'selected' : ''}" style="grid-column:${bStart}/span ${bSpan}" data-select="${name} / ${b}">${b}</button>` : ''}
      </div></div>`;
    }

    function inspector() {
      return `<div class="rows">
        <div class="field"><span>Selection</span><strong class="selection">${state.selected}</strong></div>
        <div class="field"><span>Starts</span><span>41.bar</span></div>
        <div class="field"><span>Duration</span><span>8.bar</span></div>
        <div class="field"><span>Traversal</span><span>loop</span></div>
        <div class="field"><span>Pattern</span><span>bass_hook</span></div>
        <div class="field"><span>Transpose</span><span class="value">0 st</span></div>
        <div class="commands"><button class="action" data-edit>Set transpose +5 st</button></div>
      </div>`;
    }

    function mixerRows() {
      return `<div class="rows">
        ${mixRow('DRUMS', 74, '-5.2 dB')}${mixRow('BASS', 68, '-8.0 dB')}${mixRow('MUSIC', 82, '-2.5 dB')}${mixRow('ROOM', 51, '-11 dB')}${mixRow('MASTER', 88, '-1.0 dB')}
      </div>`;
    }

    function mixRow(name, level, value) {
      return `<div class="row"><span>${name}</span><span class="meter"><i style="width:${level}%"></i></span><span class="value">${value}</span></div>`;
    }

    function impact() {
      return `<div class="source-impact"><strong>${state.staged ? 'STAGED SOURCE TRANSACTION' : 'SOURCE IMPACT'}</strong>
        ${state.staged ? 'song.crump:18 &middot; replace <code>bass_hook * 2</code> with <code>transpose(bass_hook * 2, 5)</code><br><span class="accent">Enter apply</span> &middot; Esc cancel' : 'Every structured action previews its file, exact replacement, and undo unit before it changes the candidate revision.'}
      </div>`;
    }

    function renderA() {
      return `<main class="shell">${topbar()}<div class="layout-a">
        <section class="panel source-panel"><div class="panel-title"><strong>Authoritative source</strong><span>song.crump</span></div><pre class="source">${sourceCode()}</pre><div class="statusline">NORMAL &middot; 18:7 &middot; ${state.selected}</div></section>
        <div class="side">
          <section class="panel"><div class="panel-title"><strong>Selection inspector</strong><span>source-backed</span></div>${inspector()}${impact()}</section>
          <section class="panel"><div class="panel-title"><strong>Compact mixer</strong><span>5 channels</span></div>${mixerRows()}</section>
        </div>
        <section class="panel timeline-panel"><div class="panel-title"><strong>Timeline lens</strong><span>spatial select / move / resize</span></div>${timeline()}</section>
      </div></main>`;
    }

    function renderB() {
      const arrange = `<div class="workspace-view ${state.tab === 'Arrange' ? 'active' : ''}" data-view="Arrange"><div class="canvas-grid"><section class="panel"><div class="panel-title"><strong>Arrangement</strong><span>bars 1-96</span></div>${timeline()}</section><section class="panel"><div class="panel-title"><strong>Clip inspector</strong></div>${inspector()}</section></div></div>`;
      const mix = `<div class="workspace-view ${state.tab === 'Mix' ? 'active' : ''}" data-view="Mix"><div class="mixer-bank">${['DRUMS','BASS','CHORDS','ROOM','MASTER'].map((x,i) => `<div class="strip"><strong>${x}</strong><div class="meter"><i style="width:${75-i*7}%"></i></div><div class="fader"><i></i></div><span class="value">${[-5.2,-8,-6,-11,-1][i]} dB</span><span class="muted">pan C</span></div>`).join('')}</div></div>`;
      const automate = `<div class="workspace-view ${state.tab === 'Automate' ? 'active' : ''}" data-view="Automate"><section class="panel"><div class="panel-title"><strong>BASS / gain</strong><span>absolute automation &middot; dB</span></div><div class="automation-lane"><svg viewBox="0 0 600 90" preserveAspectRatio="none"><polyline points="0,65 150,65 250,40 390,40 500,18 600,18" fill="none" stroke="#b7e35b" stroke-width="2"/><g fill="#ffbd62"><circle cx="150" cy="65" r="4"/><circle cx="250" cy="40" r="4"/><circle cx="390" cy="40" r="4"/><circle cx="500" cy="18" r="4"/></g></svg></div><div class="field"><span>At playhead</span><span class="value">-5.5 dB</span></div><div class="field"><span>Representation</span><span>bass_gain_curve (points)</span></div></section></div>`;
      return `<main class="shell">${topbar()}<div class="layout-b">
        <section class="workspace"><nav class="tabs">${['Arrange','Mix','Automate'].map(x => `<button class="tab ${state.tab === x ? 'active' : ''}" data-tab="${x}">${x}</button>`).join('')}<button class="tab">Route</button></nav><div class="canvas">${arrange}${mix}${automate}</div><div class="commands"><button class="command">: command</button><button class="command">space play</button><button class="command">g grid</button><button class="command">e exact value</button></div></section>
        <aside class="provenance"><div class="panel-title"><strong>Source impact rail</strong><span>always visible</span></div><pre class="source">${sourceCode(true)}</pre>${impact()}<div class="panel-title"><strong>Candidate status</strong></div><div class="rows"><div class="field"><span>Parse</span><span class="accent">valid</span></div><div class="field"><span>Active</span><span>r184</span></div><div class="field"><span>Undo</span><span>0 staged</span></div></div></aside>
      </div></main>`;
    }

    function renderC() {
      return `<main class="shell">${topbar()}<div class="layout-c">
        <nav class="object-tree"><div class="panel-title"><strong>Project objects</strong></div><div class="tree-label">SONG</div><button class="tree-item">&#9500; Tempo map</button><button class="tree-item">&#9500; Markers</button><div class="tree-label">MUSIC GROUP</div><button class="tree-item">&#9500; Drums</button><button class="tree-item active">&#9500; Bass / Hook B</button><button class="tree-item">&#9500; Chords</button><button class="tree-item">&#9492; Texture</button><div class="tree-label">ROUTING</div><button class="tree-item">&#9500; Room return</button><button class="tree-item">&#9492; Master</button></nav>
        <section class="lens-main"><div class="lens-header"><div><span class="muted">CLIP</span> <strong class="selection">${state.selected}</strong></div><span class="pill">defined at song.crump:18</span></div><section class="panel"><div class="panel-title"><strong>Arrangement context</strong><span>selected object centered</span></div>${timeline()}</section><section class="panel definition"><div class="panel-title"><strong>Focused definition</strong><span>source lens</span></div><pre class="source">${sourceCode(true)}</pre></section></section>
        <aside class="object-inspector"><div class="panel-title"><strong>Object commands</strong><span>clip</span></div>${inspector()}${impact()}<div class="panel-title"><strong>Related state</strong></div><div class="rows"><div class="field"><span>Track gain</span><span>-8.0 dB</span></div><div class="field"><span>Automation</span><span>1 lane</span></div><div class="field"><span>Route</span><span>Music &rarr; Master</span></div></div><div class="commandline">&gt; transpose selection 5st</div></aside>
      </div></main>`;
    }

    function currentVariant() {
      const key = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      return variants[key] ? key : 'A';
    }

    function render() {
      const key = currentVariant();
      document.querySelector('#app').innerHTML = variants[key].render();
      document.querySelector('#variant-label').textContent = `${key} - ${variants[key].name}`;
      bindWorkspace();
    }

    function setVariant(delta) {
      const keys = Object.keys(variants);
      const next = keys[(keys.indexOf(currentVariant()) + delta + keys.length) % keys.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', next);
      history.replaceState({}, '', url);
      render();
    }

    function bindWorkspace() {
      document.querySelectorAll('[data-select]').forEach(el => el.addEventListener('click', () => { state.selected = el.dataset.select; render(); }));
      document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => { state.staged = !state.staged; render(); }));
      document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { state.tab = el.dataset.tab; render(); }));
    }

    document.querySelector('#previous').addEventListener('click', () => setVariant(-1));
    document.querySelector('#next').addEventListener('click', () => setVariant(1));
    document.querySelector('#variant-label').addEventListener('click', () => setVariant(1));
    addEventListener('popstate', render);
    addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA'].includes(event.target.tagName) || event.target.isContentEditable) return;
      if (event.key === 'ArrowLeft') setVariant(-1);
      if (event.key === 'ArrowRight') setVariant(1);
    });
    render();
  </script>
</body>
</html>
